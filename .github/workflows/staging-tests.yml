name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  localizations:
    name: test_localizations
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run localization tests
        run: pytest -v tests/test_localizations.py

  unit-tests:
    name: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Throwaway values — base.py has no defaults for these two.
      SECRET_KEY: ci-not-a-real-secret
      R2_BUCKET_NAME: ci-test-bucket

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements.txt has no pytest; requirements-dev.txt has no Django.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python manage.py test unit_tests
